name: supervisee_app
description: PDCSS Supervisee Android Application for probationers and parolees in Punjab.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  flutter_bloc: ^8.1.3
  drift: ^2.10.0
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.0
  path: ^1.8.3
  flutter_secure_storage: ^8.0.0
  geolocator: ^10.0.1
  camera: ^0.10.5
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.10.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
