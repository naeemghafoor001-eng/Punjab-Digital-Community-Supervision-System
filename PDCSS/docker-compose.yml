version: '3.8'

services:
  # Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: pdcss_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - keycloak
    networks:
      - pdcss_net

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdcss_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - pdcss_net

  # PostgreSQL + PostGIS Database
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: pdcss_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdcss_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdcss_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-pdcss_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdcss_user} -d ${POSTGRES_DB:-pdcss_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pdcss_net

  # Keycloak IAM Service
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: pdcss_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_123
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - pdcss_net

  # MinIO S3 Compatible Storage
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: pdcss_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_admin_secure_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pdcss_net

  # Redis Cache & Task Broker
  redis:
    image: redis:7-alpine
    container_name: pdcss_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pdcss_net

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  pdcss_net:
    driver: bridge
